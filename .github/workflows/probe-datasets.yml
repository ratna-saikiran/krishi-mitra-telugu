name: Probe pest datasets
on:
  workflow_dispatch:
    inputs:
      queries:
        default: "ip102,insect pest"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          QUERIES: ${{ inputs.queries }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          import os
          for q in os.environ["QUERIES"].split(","):
              for d in api.list_datasets(search=q, limit=12, full=True):
                  try:
                      info = api.dataset_info(d.id, files_metadata=True)
                      size = sum((s.size or 0) for s in info.siblings) / 1e9
                      files = [s.rfilename for s in info.siblings][:6]
                  except Exception as e:
                      size, files = -1, str(e)[:80]
                  print(f"{q!r:22} {d.id:55} dl={getattr(d,'downloads',None)} size={size:.2f}GB files={files}")
          PY
