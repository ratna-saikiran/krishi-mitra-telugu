name: Publish a run's artifact as a release
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      artifact:
        required: true
      tag:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: true
          make_latest: false
          files: out/*
