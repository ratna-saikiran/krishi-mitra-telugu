name: Mirror training dataset to a release
# Publishes a train-unified run's dataset artifact as release parts so it can
# be downloaded anonymously (e.g. to train on a Mac GPU).
permissions:
  contents: write
  actions: read
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag:
        required: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unified-data
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: split -b 1900m unified.tar unified.tar.part- && rm unified.tar && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: true
          make_latest: false
          body: "Training dataset from run ${{ inputs.run_id }}. cat unified.tar.part-* > unified.tar"
          files: unified.tar.part-*
