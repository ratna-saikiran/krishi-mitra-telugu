name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: krishi-mitra-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish to the "latest-apk" release (download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          make_latest: false
          body: "Built from ${{ github.sha }}. Install on the phone, allow 'install unknown apps'."
          files: app/build/app/outputs/flutter-apk/app-release.apk
