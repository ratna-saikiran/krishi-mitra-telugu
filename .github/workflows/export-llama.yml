name: Export Llama 3.2 1B to ExecuTorch
# Needs: you accepted the Llama 3.2 license on Hugging Face and added a read
# token as the repo secret HF_TOKEN. Run from Actions > this workflow > Run.
on:
  workflow_dispatch:
    inputs:
      seq_len:
        description: "max_seq_length / max_context_length"
        default: "2048"
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ExecuTorch 1.0 (same version as the Android AAR in the app)
        run: |
          pip install executorch==1.0.0 pytorch-tokenizers tiktoken sentencepiece omegaconf hydra-core blobfile lm_eval "huggingface_hub[cli]"
      - name: Download Llama 3.2 1B Instruct (original Meta checkpoint)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN repo secret first"; exit 1; }
          huggingface-cli download meta-llama/Llama-3.2-1B-Instruct --include "original/*" --local-dir ckpt
          ls -la ckpt/original
      - name: Export (Arm learning path flags; 8da4w PTQ, XNNPACK, KV cache, SDPA, 4-bit embeddings)
        run: |
          SEQ=${{ inputs.seq_len }}
          python -m executorch.examples.models.llama.export_llama \
            --checkpoint ckpt/original/consolidated.00.pth \
            --params ckpt/original/params.json \
            -kv --use_sdpa_with_kv_cache -X --xnnpack-extended-ops -qmode 8da4w \
            --group_size 64 -d fp32 \
            --metadata '{"get_bos_id":128000, "get_eos_ids":[128009, 128001, 128006, 128007]}' \
            --embedding-quantize 4,32 \
            --max_seq_length $SEQ --max_context_length $SEQ \
            --output_name=llama3_2_1b_instruct_8da4w_g64_emb4_seq${SEQ}.pte
          mkdir -p out/llama && mv *.pte out/llama/ && cp ckpt/original/tokenizer.model out/llama/
          curl -sL https://raw.githubusercontent.com/meta-llama/llama-models/main/models/llama3_2/LICENSE -o out/llama/LICENSE.txt || true
          echo "Built with Llama. Llama 3.2 is licensed under the Llama 3.2 Community License." > out/llama/NOTICE.txt
          ls -lh out/llama
      - uses: actions/upload-artifact@v4
        with:
          name: llama-3.2-1b-executorch
          path: out/llama
          compression-level: 0
      - name: Quality check on 4 real cases (Telugu ratio, grounded doses, prompt tokens)
        continue-on-error: true
        run: |
          python llm/sample_advice.py --pte out/llama/*.pte --tokenizer out/llama/tokenizer.model \
            --params ckpt/original/params.json --out llm_samples.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-samples
          path: llm_samples.json
          if-no-files-found: ignore
