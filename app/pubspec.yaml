name: krishi_mitra
description: Offline crop disease and pest advisor for Telugu farmers (vision + Llama 3.2 on ExecuTorch).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/advisory_te.json
    - assets/advisory_en.json
    - assets/advisory_hi.json
    - assets/labels.txt
    - assets/models/classifier.tflite
